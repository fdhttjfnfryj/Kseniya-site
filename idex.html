<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио | Ксения Титойкина</title>
    <style>
        /* Базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Центрирование карточки на весь экран и приятный темный фон */
        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Стильная карточка по центру */
        .card {
            background-color: #121b2e;
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        /* Элементы профиля */
        .avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .status {
            font-size: 14px;
            color: #10b981;
            font-weight: 500;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bio {
            font-size: 15px;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* Заголовки блоков */
        h2 {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 12px;
            text-align: left;
        }

        /* Блок навыков */
        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 32px;
        }

        .skill-item {
            background-color: #1e293b;
            color: #94a3b8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #334155;
        }

        /* Блок проекта */
        .project-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            text-align: left;
            margin-bottom: 32px;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .project-name {
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }

        .project-link {
            color: #048d5f;
            text-decoration: none;
            font-size: 14px;
        }

        .project-link:hover {
            text-decoration: underline;
        }

        .project-text {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }

        /* Красивая современная кнопка */
        .cta-button {
            display: block;
            background-color: #07b178;
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        /* Эффект при наведении */
        .cta-button:hover {
            background-color: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 88, 60, 0.4);
        }

        .cta-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">КТ</div>

        <h1>Титойкина Ксения</h1>
        <div class="status">14 лет & Разработчик</div>
        <p class="bio">
            Закончила музыкальную школу,сейчас увлекаюсь программированием,занимаюсь созданием кода для сайтов и приложений.
        </p>

        <h2>Мои навыки</h2>
        <div class="skills-list">
            <span class="skill-item">Python</span>
            <span class="skill-item">Unity</span>
            <span class="skill-item">HTML5</span>
        
        </div>

        <a href="mailto:ksenia@example.com" class="cta-button">Написать мне</a>
    </div>

</body>
</html>
